<main class="admin-shell">
  <app-entity-menu />
  <section class="content-area">
    <header class="topbar"><div><strong>{{ isEditing ? 'Editar marca' : 'Cadastrar marca' }}</strong></div></header>
    <div class="content-inner">
      <section class="page-heading"><div><h1>{{ isEditing ? 'Editar marca' : 'Cadastrar marca' }}</h1></div></section>
      <section class="editor">
        <div class="editor-heading"><div><h2>Dados da marca</h2></div></div>
        <form [formGroup]="form" (ngSubmit)="save()">
          <label class="form-field"><span>Nome da marca</span><input formControlName="nome" />@if (form.controls.nome.touched && form.controls.nome.invalid) {<small class="field-error">Informe pelo menos 2 caracteres.</small>}</label>
          @if (errorMessage()) {<small class="field-error" role="alert">{{ errorMessage() }}</small>}
          <div class="form-actions"><a class="text-button" routerLink="/marcas">Cancelar</a><button class="save-button" type="submit" [disabled]="isSaving()">{{ isSaving() ? 'Salvando...' : isEditing ? 'Salvar alterações' : 'Cadastrar marca' }} <span>→</span></button></div>
        </form>
      </section>
    </div>
  </section>
</main>
