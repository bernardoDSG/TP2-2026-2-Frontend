<aside class="sidebar">
  <div class="sidebar-brand"><span class="brand-symbol">V</span><div><strong>VELOCITY</strong><small>ELITE AUTOMOTIVE</small></div></div>
  <nav aria-label="Navegação administrativa">
    <a class="nav-item" routerLink="/carros" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Carros</a>
    <a class="nav-item" routerLink="/clientes" routerLinkActive="active">Clientes</a>
    <a class="nav-item" routerLink="/cores" routerLinkActive="active">Cores</a>
    <a class="nav-item" routerLink="/marcas" routerLinkActive="active">Marcas</a>
    <a class="nav-item" routerLink="/categorias" routerLinkActive="active">Categorias</a>
    <a class="nav-item" routerLink="/enderecos/estados" routerLinkActive="active">Estados</a>
    <a class="nav-item" routerLink="/enderecos/municipios" routerLinkActive="active">Municípios</a>
    <a class="nav-item" routerLink="/patio" routerLinkActive="active">Mapa do pátio</a>
  </nav>
  <div class="theme-control" role="group" aria-label="Aparência">
    <span class="theme-label">Aparência</span>
    <div class="theme-buttons">
      <button type="button" class="theme-button" aria-label="Modo claro" title="Modo claro"
        [attr.aria-pressed]="theme.preference() === 'light'" (click)="theme.setPreference('light')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true" focusable="false">
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42" />
        </svg>
      </button>
      <button type="button" class="theme-button" aria-label="Modo escuro" title="Modo escuro"
        [attr.aria-pressed]="theme.preference() === 'dark'" (click)="theme.setPreference('dark')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <path d="M20.9 13A9 9 0 0 1 11 3.1 9 9 0 1 0 20.9 13Z" />
        </svg>
      </button>
    </div>
  </div>
</aside>
