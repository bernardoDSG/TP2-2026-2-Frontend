<main class="admin-shell">
  <app-entity-menu />
  <section class="content-area">
    <header class="topbar"><div><strong>Excluir {{ isEstado ? 'estado' : 'município' }}</strong></div></header>
    <div class="content-inner">
      <section class="page-heading"><div><h1>Excluir {{ isEstado ? 'estado' : 'município' }}</h1></div></section>
      <aside class="editor delete-panel">
        <span class="material-symbol delete-large">delete_forever</span>
        <h2>Confirmar exclusão</h2>
        <p>Deseja realmente excluir <strong>{{ name() || 'este cadastro' }}</strong>{{ detail() ? ' (' + detail() + ')' : '' }}?</p>
        @if (errorMessage()) {<p class="field-error" role="alert">{{ errorMessage() }}</p>}
        <div class="form-actions"><a class="text-button" [routerLink]="['/enderecos', kind]">Cancelar</a><button class="delete-button" type="button" (click)="remove()" [disabled]="isDeleting()">{{ isDeleting() ? 'Excluindo...' : 'Excluir' }}</button></div>
      </aside>
    </div>
  </section>
</main>
